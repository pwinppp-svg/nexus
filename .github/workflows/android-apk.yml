name: Build NEXUS AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_API_URL: ${{ secrets.NEXUS_API_URL }}
        run: npm run build

      - name: Create and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NEXUS-AI.apk

      - name: Publish APK as public download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" NEXUS-AI.apk \
            --title "NEXUS AI APK #${{ github.run_number }}" \
            --notes "Unduh NEXUS-AI.apk lalu pasang di Android (izinkan instal dari sumber tidak dikenal)." \
            --latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-AI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
